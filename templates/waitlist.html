<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Join Waitlist - Seaweed OI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="sidebar">
    <img src="{{ url_for('static', filename='seaweed_logo.png') }}" alt="Seaweed Logo" class="logo">
    <nav>
      <a href="{{ url_for('home') }}">Seaweed</a>
      <a href="{{ url_for('waitlist') }}">Test</a>
    </nav>
  </div>

  <div class="main-content">
    <h1>Join the Waitlist</h1>
    <p class="intro">Be among the first to experience Seaweed OI.</p>

    {% if success %}
      <p class="success">You’ve been added to the waitlist!</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="name" placeholder="Your Name" required><br>
      <input type="email" name="email" placeholder="Your Email" required><br>
      <button type="submit">Join Waitlist</button>
    </form>
  </div>
</body>
</html>
