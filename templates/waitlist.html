<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wren OI - Waitlist</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="sidebar">
    <img src="{{ url_for('static', filename='seaweed_logo.png') }}" alt="Seaweed Logo" class="logo">
    <nav>
      <a href="{{ url_for('home') }}">Wren</a>
      <a href="{{ url_for('waitlist') }}">Waitlist</a>
    </nav>
  </div>

  <div class="main-content">
    <h1>Test Wren</h1>
    <p class="intro">Be among the first to experience Wren Ol.</p>

    {% if success %}
      <p class="success">You’ve been added to the waitlist!</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <button type="submit">Get Early Access</button>
    </form>

    <footer>
      <div class="footer-inner">
      © 2025 Wren OI. All rights reserved.
      </div>
    </footer>
  </div>
</body>
</html>
